<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account — Subelo Distro</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<header><div class="wrap">
<a class="logo" href="/" aria-label="Subelo Distro home">
<img src="/assets/logo-mark.png" alt="" aria-hidden="true">
<span>SUB<em>ELO</em></span><small>DISTRO</small></a>
<nav class="main"><a href="/how-it-works.html">How it works</a><a href="/pricing.html">Pricing</a><a href="/faq.html">FAQ</a></nav>
<div class="acts"><a class="pill sm" href="/dashboard-login.html">Log in</a></div>
</div></header>

<main>
<section class="faqhero"><div class="wrap">
<p class="eyebrow">Create account</p>
<h1>Set up your <span style="color:var(--deep)">Subelo Distro</span> login.</h1>
<p class="lead">This is your own account on subelodistro.com — separate from the distribution platform itself.</p>
</div></section>
<section style="padding-top:0"><div class="wrap">
<div class="authwrap card">
<form id="signupForm">
<div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="new-password"></div>
<button class="pill blue" type="submit" id="submitBtn">Create account</button>
<p class="authmsg" id="msg"></p>
</form>
<p class="authswitch">Already have an account? <a href="/dashboard-login.html">Log in</a></p>
</div>
</div></section>
</main>
<footer><div class="wrap">
<div class="legal"><span>© 2026 Subelo Distro LLC. All rights reserved.</span></div>
</div></footer>

<script>
// Fill these in from your Supabase project (Settings -> API) once it exists.
const SUPABASE_URL = "https://mavxlbtbczebeydfcael.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JDbHyrpzq9Ya61LoG9mYJw_GJNNLhcI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById("signupForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "authmsg";
  msg.textContent = "";
  btn.disabled = true;
  btn.textContent = "Creating…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await sb.auth.signUp({ email, password });

  if (error) {
    msg.className = "authmsg err";
    msg.textContent = error.message;
    btn.disabled = false;
    btn.textContent = "Create account";
    return;
  }

  if (data.session) {
    // Email confirmation is off: account is immediately usable.
    window.location.href = "/dashboard-redirect.html";
  } else {
    msg.className = "authmsg ok";
    msg.textContent = "Account created — check your email to confirm, then log in.";
    btn.disabled = false;
    btn.textContent = "Create account";
  }
});
</script>
</body>
</html>
