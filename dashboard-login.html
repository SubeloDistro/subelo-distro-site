<!DOCTYPE html>
<html lang="en">

</head>
<body>
<header><div class="wrap">
<a class="logo" href="/" aria-label="Subelo Distro home">
<svg viewBox="0 0 90 34" aria-hidden="true"><g fill="#5fb1fb"><rect x="0" y="14" width="2" height="6"/><rect x="5" y="8" width="2" height="18"/><rect x="10" y="3" width="2" height="28"/><rect x="15" y="9" width="2" height="16"/><rect x="20" y="1" width="2" height="32"/><rect x="25" y="7" width="2" height="20"/><rect x="30" y="12" width="2" height="10"/><rect x="35" y="5" width="2" height="24"/><rect x="40" y="13" width="2" height="8"/><rect x="45" y="10" width="2" height="14"/><rect x="50" y="15" width="2" height="4"/><rect x="55" y="12" width="2" height="10"/><rect x="60" y="15" width="2" height="4"/><rect x="65" y="13" width="2" height="8"/><rect x="70" y="15" width="2" height="4"/><rect x="75" y="14" width="2" height="6"/></g></svg>
<span>SUB<em>ELO</em></span><small>DISTRO</small></a>
<nav class="main"><a href="/how-it-works.html">How it works</a><a href="/pricing.html">Pricing</a><a href="/faq.html">FAQ</a></nav>
<div class="acts"><a class="pill sm blue" href="/dashboard-signup.html">Sign up</a></div>
</div></header>

<main>
<section class="faqhero"><div class="wrap">
<p class="eyebrow">Log in</p>
<h1>Welcome <span style="color:var(--deep)">back.</span></h1>
<p class="lead">Log in to continue to your dashboard.</p>
</div></section>
<section style="padding-top:0"><div class="wrap">
<div class="authwrap card">
<form id="loginForm">
<div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
<button class="pill blue" type="submit" id="submitBtn">Log in</button>
<p class="authmsg" id="msg"></p>
</form>
<p class="authswitch">Need an account? <a href="/dashboard-signup.html">Sign up</a></p>
</div>
</div></section>
</main>
<footer><div class="wrap">
<div class="legal"><span>© 2026 Subelo Distro</span></div>
</div></footer>

<script>
const SUPABASE_URL = "https://mavxlbtbczebeydfcael.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JDbHyrpzq9Ya61LoG9mYJw_GJNNLhcI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "authmsg";
  msg.textContent = "";
  btn.disabled = true;
  btn.textContent = "Logging in…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    msg.className = "authmsg err";
    msg.textContent = error.message;
    btn.disabled = false;
    btn.textContent = "Log in";
    return;
  }

  window.location.href = "/dashboard-redirect.html";
});
</script>
</body>
</html>
