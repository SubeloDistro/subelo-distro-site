<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your password — Subelo Distro</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<main>
<section class="faqhero"><div class="wrap">
<p class="eyebrow">One last step</p>
<h1 id="h1">Set your <span style="color:var(--deep)">password.</span></h1>
<p class="lead" id="lead">Choose a password for your Subelo Distro account.</p>
</div></section>
<section style="padding-top:0"><div class="wrap">
<div class="authwrap card" id="formCard">
<form id="setForm">
<div class="field"><label for="password">New password</label><input id="password" type="password" required minlength="8" autocomplete="new-password"></div>
<button class="pill blue" type="submit" id="submitBtn">Set password &amp; continue</button>
<p class="authmsg" id="msg"></p>
</form>
</div>
</div></section>
</main>
<footer><div class="wrap">
<div class="legal"><span>© 2026 Subelo Distro LLC. All rights reserved.</span></div>
</div></footer>

<script>
const SUPABASE_URL = "https://mavxlbtbczebeydfcael.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JDbHyrpzq9Ya61LoG9mYJw_GJNNLhcI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const h1 = document.getElementById("h1");
const lead = document.getElementById("lead");
const formCard = document.getElementById("formCard");
const msg = document.getElementById("msg");

function showError(text) {
  h1.innerHTML = 'Link <span style="color:var(--deep)">expired.</span>';
  lead.textContent = text;
  formCard.style.display = "none";
}

// Supabase's admin-generated invite/recovery links land here with the
// session tokens in the URL hash (e.g. #access_token=...&refresh_token=...&type=invite).
// Older/newer supabase-js builds can also hand this to us via onAuthStateChange,
// so we listen for that too rather than only parsing the hash ourselves.
(async () => {
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const access_token = hash.get("access_token");
  const refresh_token = hash.get("refresh_token");
  const hashError = hash.get("error_description");

  if (hashError) {
    showError(decodeURIComponent(hashError.replace(/\+/g, " ")));
    return;
  }

  if (access_token && refresh_token) {
    const { error } = await sb.auth.setSession({ access_token, refresh_token });
    if (error) {
      showError(error.message);
      return;
    }
  } else {
    // No tokens in the URL at all -- maybe they already have a live session
    // (e.g. reloaded this page), otherwise this link is no good.
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      showError("This link is invalid, already used, or has expired. Ask for a new one, or log in if you've already set your password.");
      return;
    }
  }
})();

const form = document.getElementById("setForm");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "authmsg";
  msg.textContent = "";
  btn.disabled = true;
  btn.textContent = "Saving…";

  const password = document.getElementById("password").value;
  const { error } = await sb.auth.updateUser({ password });

  if (error) {
    msg.className = "authmsg err";
    msg.textContent = error.message;
    btn.disabled = false;
    btn.textContent = "Set password & continue";
    return;
  }

  window.location.href = "/dashboard-redirect.html";
});
</script>
</body>
</html>
