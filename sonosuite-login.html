<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logging you in — Subelo Distro</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<main>
<section class="faqhero"><div class="wrap">
<p class="eyebrow">One moment</p>
<h1 id="h1">Logging you in<span style="color:var(--deep)">…</span></h1>
<p class="lead" id="msg">Taking you to your dashboard.</p>
</div></section>
</main>

<script>
// This is where Sonosuite sends a browser whenever it needs someone to log
// in (configured on their side as the SSO "Login Url to redirect"). It may
// arrive with a "next" query param telling us which Sonosuite page they
// were headed to, e.g. /sonosuite/login?next=%2Falbums.
const SUPABASE_URL = "https://mavxlbtbczebeydfcael.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JDbHyrpzq9Ya61LoG9mYJw_GJNNLhcI";
const FUNCTION_BASE_URL = "https://subelo-distro-site.netlify.app";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async () => {
  const params = new URLSearchParams(window.location.search);
  const next = params.get("next") || "";

  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    // Not logged into Subelo Distro yet -- send them to our login page,
    // then straight back here (with the same "next") once they've signed in.
    const returnTo = "/sonosuite/login" + (next ? "?next=" + encodeURIComponent(next) : "");
    window.location.href = "/dashboard-login.html?return_to=" + encodeURIComponent(returnTo);
    return;
  }

  try {
    let fnUrl = FUNCTION_BASE_URL + "/.netlify/functions/sso-redirect";
    if (next) fnUrl += "?next=" + encodeURIComponent(next);

    const resp = await fetch(fnUrl, {
      method: "POST",
      headers: { Authorization: "Bearer " + session.access_token },
    });
    const body = await resp.json();

    if (!resp.ok) {
      document.getElementById("h1").textContent = "Something went wrong";
      document.getElementById("msg").textContent = body.error || "Please try again.";
      return;
    }

    window.location.href = body.redirect;
  } catch (err) {
    document.getElementById("h1").textContent = "Something went wrong";
    document.getElementById("msg").textContent = "Could not reach the server. Please try again.";
  }
})();
</script>
</body>
</html>
